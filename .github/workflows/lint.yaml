name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint.yaml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/lint.yaml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: npm
          node-version: 22

      - name: Install modules
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint
