name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint.yaml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/lint.yaml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 22

      - name: Install modules
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint
