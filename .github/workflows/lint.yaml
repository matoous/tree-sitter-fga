name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint.yaml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/lint.yaml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          cache: npm
          node-version: 24

      - name: Install modules
        run: npm ci

      - name: Run ESLint
        run: npm run lint
