[package]
name = "tree-sitter-fga"
description = "OpenFGA authorization schema grammar for tree-sitter"
version = "0.1.0"
license = "MIT"
readme = "README.md"
keywords = ["tree-sitter", "parsers", "fga", "openfga"]
categories = ["parsing", "text-editors", "grammars"]
repository = "https://github.com/matoous/tree-sitter-fga"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
    "/LICENSE",
    "bindings/rust/*",
    "grammar.js",
    "queries/*.scm",
    "src/*.c",
    "src/*.h",
    "src/*.json",
    "src/tree_sitter/*.h",
    "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
