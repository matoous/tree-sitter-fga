[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-fga"
description = "OpenFGA authorization schema grammar for tree-sitter"
version = "0.1.0"
keywords = ["tree-sitter", "parsers", "fga", "openfga"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["typing-extensions>=4.10"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/matoous/tree-sitter-fga"

[project.optional-dependencies]
core = ["tree-sitter>=0.25,<0.27"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
